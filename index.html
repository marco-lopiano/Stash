<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Stash</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header><input id="zoom" type="range" min="90" max="260" step="10" title="Icon size" aria-label="Icon size"></header>
  <section id="pinned" hidden></section>
  <main id="grid"></main>

  <div id="menu" role="menu" hidden></div>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <div class="seg" id="type">
        <button type="button" data-type="link" class="on">Link</button>
        <button type="button" data-type="group">Group</button>
      </div>
      <input id="name" placeholder="Name" autocomplete="off">
      <input id="url" placeholder="Link (example.com)" autocomplete="off" required>
      <div class="row" id="imgrow">
        <label class="file">Image<input id="file" type="file" accept="image/*" hidden></label>
        <button type="button" id="clear" class="quiet">Remove image</button>
      </div>
      <div class="row end">
        <button type="button" id="cancel" class="quiet">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="folder" hidden>
    <div id="folder-panel">
      <div id="folder-head">
        <h2 id="folder-title"></h2>
        <button id="folder-close" class="quiet">Done</button>
      </div>
      <div id="folder-grid"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
