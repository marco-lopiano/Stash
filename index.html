<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header><input id="zoom" type="range" min="90" max="260" step="10" title="Icon size" aria-label="Icon size"></header>
  <section id="pinned" hidden></section>
  <main id="grid"></main>

  <div id="menu" role="menu" hidden>
    <button role="menuitem" data-act="edit">Edit</button>
    <button role="menuitem" data-act="pin"></button>
    <button role="menuitem" data-act="delete" class="danger">Delete</button>
  </div>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <input id="name" placeholder="Name" autocomplete="off">
      <input id="url" placeholder="Link (example.com)" autocomplete="off" required>
      <div class="row">
        <label class="file">Image<input id="file" type="file" accept="image/*" hidden></label>
        <button type="button" id="clear" class="quiet">Remove image</button>
      </div>
      <div class="row end">
        <button type="button" id="cancel" class="quiet">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
